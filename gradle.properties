org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=35
kotlin.code.style=official

# Base URL the debug build points the app at.
# 10.0.2.2 is the Android emulator's alias for the host machine's localhost,
# so this reaches a merge-fruit-api instance running locally on the host.
# Override in a local.properties entry (debugApiBaseUrl=...) to point at a
# different backend (e.g. the deployed Render instance) without editing this file.
DEBUG_API_BASE_URL=http://192.168.0.226:8080
RELEASE_API_BASE_URL=https://your-backend.example.com
